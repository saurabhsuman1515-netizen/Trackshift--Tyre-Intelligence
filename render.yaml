services:
  - type: web
    name: trackshift-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /demo
    envVars:
      - key: CORS_ORIGINS
        value: "*"          # replace with your Vercel URL(s) after the frontend is deployed
      - key: PYTHON_VERSION
        value: "3.11.9"
